<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicia sessió — Portal de tiquets</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="auth-card">
  <div class="eyebrow"><span class="eyebrow-brand">UAUU</span> · Portal de tiquets</div>
  <h1 id="loginTitle">Inicia sessió</h1>
  <p class="subtitle" id="loginSubtitle">Introdueix el teu correu i et enviarem un enllaç per entrar (sense contrasenya).</p>

  <p class="error" id="formError" role="alert" aria-live="polite"></p>
  <p class="success" id="formSuccess" role="status" aria-live="polite"></p>

  <div id="notRegisteredBox" style="display:none">
    <p class="success" style="display:block" role="status" aria-live="polite">Aquest correu no està registrat. Registra't primer per continuar.</p>
    <a href="#" id="goToRegistreLink" class="auth-back-link">Anar a la pàgina de registre →</a>
  </div>

  <form id="loginForm">
    <label for="email">Correu</label>
    <input type="email" id="email" name="email" autocomplete="email" required>
    <button type="submit" id="submitBtn">Enviar enllaç d'accés</button>
  </form>

  <p id="signedInStatus" style="display:none; font-size:0.9rem; color:var(--ink-soft);"></p>

  <a href="registre.html" class="auth-back-link" id="registreLink">Encara no tens accés? Sol·licita'l</a>
  <a href="index.html" class="auth-back-link">← Tornar al portal</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth-session.js"></script>
<script src="js/i18n.js" defer></script>
<script src="js/error-messages.js" defer></script>
<script src="js/login-form.js" defer></script>
</body>
</html>
