<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El meu compte — Portal de tiquets</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="auth-card">
  <div class="eyebrow"><span class="eyebrow-brand">UAUU</span> · Portal de tiquets</div>
  <h1>El meu compte</h1>
  <p class="subtitle">Canvia la teva contrasenya.</p>

  <p class="error" id="formError" role="alert" aria-live="polite"></p>
  <p class="success" id="formSuccess" role="status" aria-live="polite"></p>

  <form id="changePasswordForm">
    <label for="currentPassword">Contrasenya actual</label>
    <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required>
    <label for="newPassword">Contrasenya nova</label>
    <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" required>
    <label for="newPasswordRepeat">Repeteix la contrasenya nova</label>
    <input type="password" id="newPasswordRepeat" name="newPasswordRepeat" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="submitBtn">Canviar contrasenya</button>
  </form>

  <a href="index.html" class="auth-back-link">← Tornar al portal</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth-session.js"></script>
<script src="js/i18n.js" defer></script>
<script src="js/error-messages.js" defer></script>
<script src="js/compte-form.js" defer></script>
</body>
</html>
